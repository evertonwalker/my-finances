services:
  postgres:
    image: postgres:16-alpine
    container_name: my-finances-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: finances
      POSTGRES_PASSWORD: finances
      POSTGRES_DB: finances
    ports:
      - "5433:5432" # 5433 no host para não conflitar com um Postgres local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finances -d finances"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
