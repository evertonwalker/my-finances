services:
  - type: web
    name: my-finances
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: APP_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL # Postgres do Neon (grátis): postgres://...?sslmode=require
        sync: false
